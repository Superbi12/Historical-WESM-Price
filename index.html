<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Prices Over Time</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <script src="lib/papaparse.min.js"></script>
  <style>
    .container {
      max-width: 95%;
      margin: 0 auto;
      padding: 20px;
      text-align: center; /* Center all content */
    }
    .title {
      font-size: 2.5em;
      margin: 20px 0;
      color: #333;
    }
    .legend-custom {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }
    .legend-custom span {
      font-size: 1.2em;
      cursor: pointer;
    }
    #priceChart {
      width: 100% !important;
      height: 60vh !important; /* Use viewport height for responsiveness */
      max-height: 600px; /* Cap max height for very large screens */
    }
    .filter-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin: 20px 0;
    }
    select, button {
      padding: 8px;
      font-size: 1em;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #3498db;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #2980b9;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
    td:nth-child(2), td:nth-child(3) {
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">Market Prices Over Time</h1>
    <div class="legend-custom">
      <span id="legend-botolan" style="color: #3498db; font-weight: bold;">⬤ BOTOLAN</span>
      <span id="legend-olongapo" style="color: #2ecc71; font-weight: bold;">⬤ OLONGAPO</span>
    </div>
    <div class="filter-group">
      <label for="yearFilter">Year:</label>
      <select id="yearFilter">
        <option value="All">All</option>
      </select>
      <label for="monthFilter">Billing Month:</label>
      <select id="monthFilter">
        <option value="All">All</option>
      </select>
      <label for="intervalFilter">Interval:</label>
      <select id="intervalFilter">
        <option value="5min">5 Minutes</option>
        <option value="hourly">Hourly</option>
        <option value="daily">Daily</option>
      </select>
    </div>
    <button id="downloadChart">Download Chart</button>
    <canvas id="priceChart"></canvas>
    <table id="dataTable">
      <thead>
        <tr>
          <th>Date & Time</th>
          <th>BOTOLAN (₱/kWh)</th>
          <th>OLONGAPO (₱/kWh)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="script.js"></script>
</body>
</html>
